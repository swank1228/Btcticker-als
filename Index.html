<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Index Ticker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0e11;
    color: #fff;
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .main-card {
    background: #161a1e;
    border-radius: 20px;
    padding: 32px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    width: 100%;
    max-width: 420px;
    margin-bottom: 16px;
  }
  .label {
    color: #848e9c;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .price {
    font-size: 44px;
    font-weight: 700;
    transition: color 0.3s ease;
    word-break: break-word;
  }
  .change {
    font-size: 15px;
    margin-top: 8px;
    font-weight: 600;
  }
  .up { color: #0ecb81; }
  .down { color: #f6465d; }
  .neutral { color: #848e9c; }
  .sources {
    width: 100%;
    max-width: 420px;
    background: #161a1e;
    border-radius: 16px;
    padding: 16px 20px;
  }
  .source-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 14px;
    border-bottom: 1px solid #242830;
  }
  .source-row:last-child { border-bottom: none; }
  .ex-name { color: #848e9c; }
  .ex-price { font-weight: 600; }
  .footer {
    margin-top: 14px;
    font-size: 10.5px;
    color: #5e6673;
    text-align: center;
    line-height: 1.5;
  }
  .pulse {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #0ecb81;
    margin-right: 6px;
    animation: blink 1.5s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="main-card">
  <div class="label"><span class="pulse"></span>BTC / USD — Index Average</div>
  <div class="price" id="indexPrice">$--,---</div>
  <div class="change neutral" id="change">-- %</div>
</div>

<div class="sources" id="sources">
  <div class="source-row"><span class="ex-name">Coinbase</span><span class="ex-price" id="p-coinbase">--</span></div>
  <div class="source-row"><span class="ex-name">Kraken</span><span class="ex-price" id="p-kraken">--</span></div>
  <div class="source-row"><span class="ex-name">Gemini</span><span class="ex-price" id="p-gemini">--</span></div>
  <div class="source-row"><span class="ex-name">Bitstamp</span><span class="ex-price" id="p-bitstamp">--</span></div>
  <div class="source-row"><span class="ex-name">Bitfinex</span><span class="ex-price" id="p-bitfinex">--</span></div>
</div>

<div class="footer">
  Updates every 3s · Outlier-trimmed average across 5 exchanges<br>
  Approximates CF Benchmarks BRTI methodology used by Kalshi
</div>

<script>
const indexPriceEl = document.getElementById('indexPrice');
const changeEl = document.getElementById('change');
let lastIndex = null;
let openIndex = null;

async function safeFetch(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('bad response');
    return await res.json();
  } catch (e) {
    return null;
  }
}

async function getCoinbase() {
  const d = await safeFetch('https://api.coinbase.com/v2/prices/BTC-USD/spot');
  return d ? parseFloat(d.data.amount) : null;
}
async function getKraken() {
  const d = await safeFetch('https://api.kraken.com/0/public/Ticker?pair=XBTUSD');
  if (!d || !d.result) return null;
  const key = Object.keys(d.result)[0];
  return parseFloat(d.result[key].c[0]);
}
async function getGemini() {
  const d = await safeFetch('https://api.gemini.com/v1/pubticker/btcusd');
  return d ? parseFloat(d.last) : null;
}
async function getBitstamp() {
  const d = await safeFetch('https://www.bitstamp.net/api/v2/ticker/btcusd/');
  return d ? parseFloat(d.last) : null;
}
async function getBitfinex() {
  const d = await safeFetch('https://api-pub.bitfinex.com/v2/ticker/tBTCUSD');
  return Array.isArray(d) ? parseFloat(d[6]) : null;
}

function fmt(n) {
  if (n === null || isNaN(n)) return 'N/A';
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function trimmedMean(values) {
  const valid = values.filter(v => v !== null && !isNaN(v));
  if (valid.length === 0) return null;
  if (valid.length < 4) {
    return valid.reduce((a, b) => a + b, 0) / valid.length;
  }
  const sorted = [...valid].sort((a, b) => a - b);
  const trimmed = sorted.slice(1, -1); // drop lowest and highest
  return trimmed.reduce((a, b) => a + b, 0) / trimmed.length;
}

async function updateAll() {
  const [cb, kr, ge, bs, bf] = await Promise.all([
    getCoinbase(), getKraken(), getGemini(), getBitstamp(), getBitfinex()
  ]);

  document.getElementById('p-coinbase').textContent = fmt(cb);
  document.getElementById('p-kraken').textContent = fmt(kr);
  document.getElementById('p-gemini').textContent = fmt(ge);
  document.getElementById('p-bitstamp').textContent = fmt(bs);
  document.getElementById('p-bitfinex').textContent = fmt(bf);

  const index = trimmedMean([cb, kr, ge, bs, bf]);

  if (index !== null) {
    if (openIndex === null) openIndex = index;

    indexPriceEl.textContent = fmt(index);

    if (lastIndex !== null) {
      indexPriceEl.style.color = index > lastIndex ? '#0ecb81' : index < lastIndex ? '#f6465d' : '#fff';
    }
    lastIndex = index;

    const pct = ((index - openIndex) / openIndex) * 100;
    changeEl.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(3) + '% (session)';
    changeEl.className = 'change ' + (pct > 0 ? 'up' : pct < 0 ? 'down' : 'neutral');
  } else {
    indexPriceEl.textContent = 'Error';
  }
}

updateAll();
setInterval(updateAll, 3000);
</script>

</body>
</html>
